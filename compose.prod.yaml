name: safewhale-production

# EC2 실배포용 Compose. 소스를 빌드하지 않고 GHCR 이미지 태그를 내려받는다.
# 실행: docker compose --env-file .env.production -f compose.prod.yaml up -d
services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
    volumes:
      - ${NGINX_CONFIG:-./nginx.bootstrap.conf.template}:/etc/nginx/templates/default.conf.template:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    pull_policy: always
    init: true
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      DB_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      FILE_UPLOAD_DIR: /app/uploads
      # prod 프로필에는 application-local.yml의 AI_MODE 매핑이 로드되지 않는다.
      # Spring Boot 프로퍼티 이름을 직접 환경변수로 주입해 실제 FastAPI 모드를 활성화한다.
      APP_EXTERNAL_AI: http
      APP_EXTERNAL_AI_SERVER_BASE_URL: http://ai:8000
      APP_EXTERNAL_AI_SERVER_CONNECT_TIMEOUT: 5s
      APP_EXTERNAL_AI_SERVER_READ_TIMEOUT: 180s
      APP_EXTERNAL_AI_SERVER_QUESTION_COUNT: 3
      AGENT_TOKEN: ${AGENT_TOKEN:?AGENT_TOKEN is required}
    expose:
      - "8080"
    volumes:
      - safewhale-uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    expose:
      - "5432"
    volumes:
      - safewhale-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  ai:
    image: ${AI_IMAGE:?AI_IMAGE is required}
    pull_policy: always
    init: true
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      BACKEND_MODE: http
      BACKEND_BASE_URL: http://backend:8080
      AGENT_TOKEN: ${AGENT_TOKEN:?AGENT_TOKEN is required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required}
      MODEL_NAME: ${MODEL_NAME:-gemini-3.1-flash-lite}
      THINKING_LEVEL: ${THINKING_LEVEL:-low}
      LANGFUSE_TRACING_ENVIRONMENT: prod
    expose:
      - "8000"
    mem_limit: ${AI_MEMORY_LIMIT:-160m}
    depends_on:
      backend:
        condition: service_healthy

  # 최초 인증서 발급/갱신 시에만 --profile certbot으로 실행한다.
  certbot:
    image: certbot/certbot:latest
    profiles: ["certbot"]
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:?CERTBOT_EMAIL is required}
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        certbot certonly --webroot --webroot-path /var/www/certbot
        --email "$$CERTBOT_EMAIL" --agree-tos --no-eff-email
        -d "$$API_DOMAIN"
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt

volumes:
  safewhale-postgres:
  safewhale-uploads:
  certbot-www:
  certbot-conf:
