name: safewhale-deployment

# 통합 배포 구조를 로컬에서 검증하는 Compose다.
# 단독 개발용 백엔드를 종료한 상태에서 Nginx를 로컬 8080으로 공개한다.
services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ../backend
    image: safewhale/backend:integrated-local
    restart: unless-stopped
    # 기존 백엔드 로컬 비밀값을 읽되, 컨테이너 간 주소만 내부 DNS로 교체한다.
    env_file:
      - ../backend/.env
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/safewhale
      DB_USERNAME: safewhale
      DB_PASSWORD: safewhale
      FILE_UPLOAD_DIR: /app/uploads
      AI_MODE: http
      AI_SERVER_BASE_URL: http://ai:8000
      CORS_ALLOWED_ORIGINS: http://localhost:5175,http://localhost:8080
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - safewhale-uploads:/app/uploads

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: safewhale
      POSTGRES_USER: safewhale
      POSTGRES_PASSWORD: safewhale
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safewhale -d safewhale"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - safewhale-postgres:/var/lib/postgresql/data

  ai:
    build:
      context: ../ai-server
    image: safewhale/ai:integrated-local
    restart: unless-stopped
    env_file:
      - ../ai-server/.env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      BACKEND_MODE: http
      BACKEND_BASE_URL: http://backend:8080
    expose:
      - "8000"
    mem_limit: 160m
    depends_on:
      backend:
        condition: service_healthy

volumes:
  safewhale-postgres:
  safewhale-uploads:
